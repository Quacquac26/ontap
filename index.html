<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Web ôn thi</title>
<style>
:root{--bg:#f6f7f9;--c:#fff;--t:#1c2330;--m:#6b7380;--b:#dfe3e9;--p:#2f6fed;--ok:#1a9b5b;--okb:#e3f6ec;--no:#d33b3b;--nob:#fde8e8}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--c:#1d2229;--t:#e8ebf0;--m:#97a0ad;--b:#323a45;--p:#6a9bff;--ok:#4cc58b;--okb:#17352a;--no:#ff7b7b;--nob:#3a1e21}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
header,nav,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
header{margin:0;padding:10px 14px;background:var(--c);border-bottom:1px solid var(--b)}
nav{margin:0;padding:8px 14px 0;overflow-x:auto;flex-wrap:nowrap}nav button{white-space:nowrap}
main{max-width:820px;margin:0 auto;padding:6px 14px 80px}
button,select,input,textarea,.btn{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px 12px}
button,.btn{cursor:pointer}button.on{border-color:var(--p);color:var(--p);font-weight:600}
button.p{background:var(--p);border-color:var(--p);color:#fff}button.d{color:var(--no)}button:disabled{opacity:.4}
textarea,#sq{width:100%}#sq{flex:1;min-width:160px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin:10px 0}
.item{cursor:pointer;padding:10px 14px;margin:6px 0}
.q{white-space:pre-wrap;font-weight:600;margin:10px 0}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--b);border-radius:10px;background:var(--c)}
.opt span{white-space:pre-wrap;flex:1}
.opt.sel{border-color:var(--p);background:color-mix(in srgb,var(--p) 14%,transparent)}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.no{border-color:var(--no);background:var(--nob)}
.bar{height:6px;background:var(--b);border-radius:9px}.bar i{display:block;height:100%;background:var(--p);border-radius:9px}
.m{color:var(--m);font-size:14px;margin:4px 0}.tag{font-size:12px;color:var(--no);border:1px solid var(--no);border-radius:6px;padding:0 6px;margin-left:6px}
.gok{border-left:4px solid var(--ok)}.gno{border-left:4px solid var(--no)}
.ov{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:9}
.mod{background:var(--c);border-radius:14px;padding:16px;width:100%;max-width:640px}
.orow{display:flex;gap:6px;align-items:center;margin:6px 0}.orow .eo{flex:1;min-width:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:99;max-width:90%}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head><body><div id="app"></div><div id="modal"></div><div id="toast"></div>
<script>
// ===== DỮ LIỆU & TIỆN ÍCH =====
const uid=()=>Math.random().toString(36).slice(2,9),$=s=>document.querySelector(s),LET='ABCDEFGH',K='quizweb_v1';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.decks||!S.decks.length)S={decks:[{id:uid(),name:'Bộ đề 1',qs:[]}]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Không lưu được vào trình duyệt!')}};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
const D=()=>S.decks.find(d=>d.id===S.cur)||(S.cur=S.decks[0].id,S.decks[0]);
let V='edit',F={q:'',f:'all'},P=null,E=null,PV=null,SK=new Set(),UD=[];
let PS=Object.assign({mode:'test',n:'40',pool:'all',sq:true,so:'q'},S.ps||{});
// câu có đáp án kiểu "Chỉ II và III", "Cả A và B", "Tất cả..." thì tự đặt không đảo
const AUTO=/(tất cả|cả\s+[A-D]\b|\b[A-D]\s+và\s+[A-D]\b|đều\s+(đúng|sai)|không\s+có\s+(câu|đáp))/i,ROM=/^(Chỉ\s+)?[IVX]+(\s*,|\s+và\s|$)/;
const mk=(q,o,a)=>({id:uid(),q,o,a:a||[],sh:!o.some(x=>AUTO.test(x)||ROM.test(x.trim())),w:0});

// ===== ĐỌC FILE: EXCEL / CSV =====
function fromRows(r){const h=r.findIndex(x=>x.some(c=>/^(câu hỏi|question)$/i.test(String(c).trim())));
 const hd=h>=0?r[h].map(c=>String(c).trim()):[];
 let qc=hd.findIndex(c=>/câu hỏi|question/i.test(c)),ac=hd.findIndex(c=>/^(đáp án( đúng)?|answer|key)$/i.test(c)),oc=[];
 hd.forEach((c,i)=>/^(đáp án\s*)?[A-H]$/i.test(c)&&oc.push(i));
 if(qc<0){const s=r.find(x=>x.filter(c=>String(c).trim()).length>2)||[];qc=/^\d+$/.test(String(s[0]).trim())?1:0;oc=[];for(let i=qc+1;i<s.length;i++)oc.push(i)}
 const fm=v=>String(v).trim().replace(/^(-?\d+)\.(\d+)(%?)$/,'$1,$2$3'),out=[];
 for(const x of r.slice(h+1)){const q=String(x[qc]||'').trim(),o=oc.map(i=>fm(x[i]??''));while(o.length&&!o[o.length-1])o.pop();if(!q||!o.length)continue;
  let a=[];if(ac>=0){const v=String(x[ac]).trim().toUpperCase();if(/^[A-H](\s*(,|;|&|\+|VÀ)?\s*[A-H])*$/.test(v))a=[...new Set(v.match(/[A-H]/g).map(l=>LET.indexOf(l)))].filter(i=>i<o.length)}
  out.push(mk(q,o,a))}
 return out}

// ===== ĐỌC FILE: WORD (.docx) - nhận diện chữ đỏ / highlight / đậm / gạch chân =====
async function docxLines(f){const z=await JSZip.loadAsync(await f.arrayBuffer()),x=await z.file('word/document.xml').async('string');
 const doc=new DOMParser().parseFromString(x,'application/xml'),W='http://schemas.openxmlformats.org/wordprocessingml/2006/main',out=[];
 for(const p of doc.getElementsByTagNameNS(W,'p')){let t='',fl={r:0,h:0,b:0,u:0};
  for(const r of p.getElementsByTagNameNS(W,'r')){let s='';for(const c of r.childNodes){if(c.localName==='t')s+=c.textContent;else if(c.localName==='tab'||c.localName==='br')s+=' '}
   if(s.trim()){const pr=r.getElementsByTagNameNS(W,'rPr')[0];
    if(pr){const g=n=>pr.getElementsByTagNameNS(W,n)[0],v=e=>e?e.getAttributeNS(W,'val'):null,co=v(g('color')),hl=g('highlight'),b=g('b'),u=g('u'),L=s.length;
     if(/^[0-9a-f]{6}$/i.test(co||'')){const n=parseInt(co,16);if((n>>16)>180&&((n>>8)&255)<110&&(n&255)<110)fl.r+=L}
     if(hl&&v(hl)!=='none')fl.h+=L;if(b&&v(b)!=='0'&&v(b)!=='false')fl.b+=L;if(u&&v(u)!=='none')fl.u+=L}}
   t+=s}
  t=t.trim();if(t){for(const k in fl)fl[k]=fl[k]>=t.length*.5;out.push({t,f:fl})}}
 return out}

// ===== ĐỌC FILE: PDF (chỉ lấy chữ, nối liên tục qua các trang, bỏ số trang/dòng lặp) =====
async function pdfLines(f){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,out=[];
 for(let i=1;i<=d.numPages;i++){const tc=await(await d.getPage(i)).getTextContent(),ls=[];
  for(const it of tc.items){if(!it.str)continue;const y=Math.round(it.transform[5]);let l=ls.find(l=>Math.abs(l.y-y)<3);if(!l)ls.push(l={y,s:[]});l.s.push([it.transform[4],it.str])}
  ls.sort((a,b)=>b.y-a.y).forEach(l=>out.push(l.s.sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(' ').replace(/\s+/g,' ').trim()))}
 const cnt={};out.forEach(s=>cnt[s]=(cnt[s]||0)+1);
 return out.filter(s=>s&&!/^(trang\s*)?\d+(\s*\/\s*\d+)?$/i.test(s)&&!(cnt[s]>=3&&s.length<80&&!/^[A-Ha-h][.):]/.test(s))).map(t=>({t,f:{}}))}

// ===== TÁCH CÂU HỎI TỪ VĂN BẢN (Word / PDF / dán) =====
function fromLines(L){const Q=[],qre=/^(?:câu|question|q)\s*(\d+)\s*[:.)\-–]?\s*(.*)$/i,nre=/^(\d+)\s*[.)]\s+(.+)$/,ore=/^([A-Ha-h])\s*[.):]\s*(.*)$/,
 are=/^(?:đáp án|dap an|đ\/a|answer|key)(?:\s*đúng)?\s*[:\-–]?\s*([A-Ha-h](?:\s*[,;&+]?\s*(?:và\s*)?[A-Ha-h])*)\s*$/i;let c=null;
 for(const {t,f} of L){let m;
  const tp=t.match(/(\d+)\s*[-–:.)]?\s*([A-Ha-h])/g);
  if(tp&&tp.length>=2&&t.replace(/(\d+)\s*[-–:.)]?\s*[A-Ha-h][\s,;]*/g,'').trim()===''){ // bảng đáp án "1-B, 2-A"
   tp.forEach(s=>{const k=s.match(/(\d+)\s*[-–:.)]?\s*([A-Ha-h])/),q=Q.find(x=>x.n===+k[1]);if(q)q.a=[LET.indexOf(k[2].toUpperCase())]});continue}
  if(m=t.match(qre)||t.match(nre)){c={n:+m[1],q:m[2],o:[],fl:[]};Q.push(c);continue}
  if(!c)continue;
  if(m=t.match(are)){c.a=(m[1].toUpperCase().match(/[A-H]/g)||[]).map(l=>LET.indexOf(l));continue}
  if(m=t.match(ore)){c.o.push(m[2]);c.fl.push(f);continue}
  if(c.o.length){c.o[c.o.length-1]+=' '+t;const z=c.fl[c.fl.length-1];for(const k in f)z[k]=z[k]||f[k]}else c.q+='\n'+t}
 return Q.filter(c=>c.q.trim()||c.o.length).map(c=>{let a=c.a;
  if(!a)for(const g of['r','h','u','b']){const ix=c.fl.map((f,i)=>f[g]?i:-1).filter(i=>i>=0);if(ix.length&&ix.length<c.o.length){a=ix;break}}
  return mk(c.q.trim(),c.o.map(s=>s.trim()),(a||[]).filter(i=>i<c.o.length))})}

// ===== GIAO DIỆN CHUNG =====
function R(){const d=D();$('#app').innerHTML=`<header><select data-c="deck">${S.decks.map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${esc(x.name)} (${x.qs.length})</option>`).join('')}</select><button data-a="nd">+ Bộ mới</button><button data-a="rd">Đổi tên</button><button data-a="dd">Xóa bộ</button></header>
<nav>${[['edit','Câu hỏi'],['quick','Chọn đáp án nhanh'],['prac','Luyện tập'],['io','Nhập / Xuất']].map(([k,n])=>`<button data-a="tab" data-k="${k}" class="${V===k?'on':''}">${n}</button>`).join('')}</nav>
<main>${V==='edit'?vEdit():V==='quick'?vQuick():V==='prac'?vPrac():vIO()}</main>`;if(V==='edit')L();M()}

// ===== TAB: DANH SÁCH / TÌM KIẾM / SỬA CÂU HỎI =====
function vEdit(){const d=D(),n=d.qs.filter(q=>!q.a.length).length;
 return `<div class="row"><input id="sq" placeholder="Tìm câu hỏi hoặc đáp án…" value="${esc(F.q)}"><select data-c="sf">${[['all','Tất cả'],['na','Chưa có đáp án'],['wr','Hay sai']].map(([k,t])=>`<option value="${k}" ${F.f===k?'selected':''}>${t}</option>`).join('')}</select><button class="p" data-a="add">+ Thêm câu</button></div><p class="m">${d.qs.length} câu · ${n} chưa có đáp án</p><div id="list"></div>`}
function L(){const d=D(),k=F.q.toLowerCase().trim();
 const r=d.qs.map((q,i)=>[q,i]).filter(([q,i])=>(F.f==='all'||(F.f==='na'&&!q.a.length)||(F.f==='wr'&&q.w>0))&&(!k||(i+1+' '+q.q+' '+q.o.join(' ')).toLowerCase().includes(k)));
 $('#list').innerHTML=r.slice(0,100).map(([q,i])=>`<div class="card item" data-a="edit" data-i="${i}"><b>${i+1}.</b> ${esc(q.q.length>160?q.q.slice(0,160)+'…':q.q)}<div class="m">${q.a.length?'Đáp án: '+q.a.map(j=>LET[j]).join(', '):'<span class="tag">chưa có đáp án</span>'} · ${q.o.length} lựa chọn${q.sh===false?' · không đảo':''}${q.w>0?' · sai '+q.w:''}</div></div>`).join('')+(r.length>100?`<p class="m">Hiện 100/${r.length} câu, gõ tìm kiếm để thu hẹp.</p>`:r.length?'':'<p class="m">Không có câu nào.</p>')}
function M(){$('#modal').innerHTML=E?`<div class="ov"><div class="mod"><b>${E.i>=0?'Sửa câu '+(E.i+1):'Câu mới'}</b><textarea id="eq" rows="4">${esc(E.q.q)}</textarea><p class="m">Tick ô vuông = đáp án đúng (tick nhiều ô nếu câu có nhiều đáp án đúng).</p>
${E.q.o.map((o,j)=>`<div class="orow"><input type="checkbox" class="ec" data-j="${j}" ${E.q.a.includes(j)?'checked':''}><b>${LET[j]}</b><input class="eo" value="${esc(o)}"><button class="d" data-a="rmo" data-j="${j}">×</button></div>`).join('')}
${E.q.o.length<8?'<button data-a="ao">+ Thêm đáp án</button>':''}<p><label>Đảo đáp án: <select id="esh"><option value="1">Theo cài đặt (đảo)</option><option value="0" ${E.q.sh===false?'selected':''}>Giữ nguyên thứ tự</option></select></label></p>
<div class="row"><button class="p" data-a="es">Lưu</button><button data-a="ec">Hủy</button>${E.i>=0?'<button class="d" data-a="edel">Xóa câu</button>':''}</div></div></div>`:''}
function sy(){if(!E)return;E.q.q=$('#eq').value;E.q.o=[...document.querySelectorAll('.eo')].map(i=>i.value);E.q.a=[...document.querySelectorAll('.ec')].map((c,j)=>c.checked?j:-1).filter(j=>j>=0);E.q.sh=$('#esh').value==='1'}

// ===== TAB: CHỌN ĐÁP ÁN NHANH (cho file chưa có đáp án) =====
function vQuick(){const d=D(),Lq=d.qs.filter(q=>!q.a.length),q=Lq.find(x=>!SK.has(x.id));
 if(!Lq.length)return '<div class="card">✅ Tất cả câu đều đã có đáp án.</div>';
 if(!q)return `<div class="card">Bạn đã bỏ qua ${Lq.length} câu. <button data-a="rs">Xem lại các câu bỏ qua</button></div>`;
 return `<div class="card"><div class="m">Câu ${d.qs.indexOf(q)+1} · còn ${Lq.length} câu chưa có đáp án · gõ phím A–${LET[q.o.length-1]} để chọn</div><div class="q">${esc(q.q)}</div>${q.o.map((o,j)=>`<button class="opt" data-a="qk" data-id="${q.id}" data-j="${j}"><b>${LET[j]}</b><span>${esc(o)}</span></button>`).join('')}<div class="row"><button data-a="qs" data-id="${q.id}">Bỏ qua</button><button data-a="qu" ${UD.length?'':'disabled'}>↩ Quay lại câu trước</button></div></div>`}

// ===== TAB: LUYỆN TẬP (thi thử / học thuộc / flashcard) =====
function vPrac(){if(P)return P.end?vRes():P.mode==='card'?vCard():vQ();
 const d=D(),ok=d.qs.filter(q=>q.a.length&&q.o.length>1).length,b=(k,v,t)=>`<button data-a="ps" data-k="${k}" data-v="${v}" class="${PS[k]===v?'on':''}">${t}</button>`;
 return `<div class="card"><p class="m">${ok}/${d.qs.length} câu có đáp án (câu chưa có đáp án sẽ bị bỏ qua).</p>
<b>Chế độ</b><div class="row">${b('mode','test','Thi thử (chấm cuối bài)')}${b('mode','learn','Học thuộc (hiện đúng/sai ngay)')}${b('mode','card','Flashcard')}</div>
<b>Số câu (lấy ngẫu nhiên)</b><div class="row">${['20','40','50','100','all'].map(v=>b('n',v,v==='all'?'Tất cả':v)).join('')}<input type="number" min="1" placeholder="Số khác" data-c="psn" style="width:110px" value="${['20','40','50','100','all'].includes(PS.n)?'':PS.n}"></div>
<b>Nguồn câu hỏi</b><div class="row">${b('pool','all','Tất cả câu')}${b('pool','wr','Chỉ câu hay sai')}</div>
<b>Thứ tự</b><div class="row"><label><input type="checkbox" data-c="psq" ${PS.sq?'checked':''}> Đảo thứ tự câu hỏi</label><label>Đảo đáp án: <select data-c="pso">${[['q','Theo từng câu'],['y','Luôn đảo'],['n','Không đảo']].map(([k,t])=>`<option value="${k}" ${PS.so===k?'selected':''}>${t}</option>`).join('')}</select></label></div>
<button class="p" data-a="st">Bắt đầu</button></div>`}
const mkI=q=>{const o=q.o.map((_,i)=>i);if(PS.so==='y'||(PS.so==='q'&&q.sh!==false))shuf(o);return{q,ord:o,sel:[],done:false}};
const okI=it=>it.sel.length===it.q.a.length&&it.q.a.every(x=>it.sel.includes(x));
function vQ(){const it=P.items[P.i],q=it.q,mu=q.a.length>1,ck=P.mode==='learn'&&it.done,n=P.items.length;
 return `<div class="card"><div class="row"><span class="m">Câu ${P.i+1}/${n}${mu?' · chọn '+q.a.length+' đáp án':''}</span><button data-a="ex" style="margin-left:auto">Thoát</button></div><div class="bar"><i style="width:${(P.i+1)/n*100}%"></i></div><div class="q">${esc(q.q)}</div>
${it.ord.map((oi,k)=>{const s=it.sel.includes(oi),c=q.a.includes(oi);return `<button class="opt ${ck?(c?'ok':s?'no':''):(s?'sel':'')}" data-a="pk" data-oi="${oi}"><b>${LET[k]}</b><span>${esc(q.o[oi])}</span></button>`}).join('')}
${ck?`<p><b style="color:var(--${okI(it)?'ok':'no'})">${okI(it)?'Đúng rồi!':'Chưa đúng'}</b></p>`:''}
<div class="row"><button data-a="pv" ${P.i?'':'disabled'}>← Trước</button>${P.mode==='learn'&&mu&&!it.done?'<button class="p" data-a="chk">Kiểm tra</button>':''}${P.i<n-1?'<button class="p" data-a="nx">Sau →</button>':''}<button data-a="sub" style="margin-left:auto" class="${P.i===n-1?'p':''}">Nộp bài</button></div></div>`}
function vRes(){const it=P.items,ok=it.filter(x=>x.ok).length,f=P.flt;
 return `<div class="card"><h3>Kết quả: ${ok}/${it.length} (${Math.round(ok/it.length*100)}%)</h3><div class="row">${[['all','Tất cả'],['wr','Sai ('+(it.length-ok)+')'],['ok','Đúng ('+ok+')']].map(([k,t])=>`<button data-a="flt" data-k="${k}" class="${f===k?'on':''}">${t}</button>`).join('')}<button class="p" data-a="retry" ${ok===it.length?'disabled':''}>Làm lại câu sai</button><button data-a="ex">Về menu</button></div></div>`
 +it.map((x,i)=>[x,i]).filter(([x])=>f==='all'||(f==='ok')===x.ok).map(([x,i])=>`<div class="card ${x.ok?'gok':'gno'}"><div class="m">Câu ${i+1} · ${x.ok?'Đúng':x.sel.length?'Sai':'Chưa trả lời'}</div><div class="q">${esc(x.q.q)}</div>${x.ord.map((oi,k)=>`<div class="opt ${x.q.a.includes(oi)?'ok':x.sel.includes(oi)?'no':''}"><b>${LET[k]}</b><span>${esc(x.q.o[oi])}${x.sel.includes(oi)?' ← bạn chọn':''}</span></div>`).join('')}</div>`).join('')}
function vCard(){const c=P.items[0];if(!c)return `<div class="card"><h3>Hoàn thành 🎉</h3><p>Đã nhớ ${P.ok} thẻ.</p><button class="p" data-a="ex">Về menu</button></div>`;
 return `<div class="card"><div class="row"><span class="m">Còn ${P.items.length} thẻ</span><label style="margin-left:auto"><input type="checkbox" data-c="popt" ${P.opt?'checked':''}> Hiện đáp án A–D</label><button data-a="ex">Thoát</button></div><div class="q">${esc(c.q.q)}</div>${P.opt?c.ord.map((oi,k)=>`<div class="opt"><b>${LET[k]}</b><span>${esc(c.q.o[oi])}</span></div>`).join(''):''}
${P.flip?`<div class="opt ok" style="margin-top:12px"><span>${c.q.a.map(i=>`<b>${LET[c.ord.indexOf(i)]}.</b> ${esc(c.q.o[i])}`).join('<br>')}</span></div><div class="row"><button class="d" data-a="no">Chưa nhớ</button><button class="p" data-a="kn">Nhớ rồi</button></div>`:'<button class="p" data-a="fl">Lật xem đáp án</button>'}</div>`}
function fin(){P.items.forEach(it=>{it.ok=okI(it);if(!it.ok)it.q.w=(it.q.w||0)+1;else if(it.q.w>0)it.q.w--});save();P.end=true;P.flt='all';R()}

// ===== TAB: NHẬP / XUẤT =====
function vIO(){return `<div class="card"><b>Nhập đề vào bộ "${esc(D().name)}"</b><p><input type="file" data-c="file" accept=".xlsx,.xls,.csv,.docx,.pdf,.txt"></p><p class="m">Excel/CSV: cột STT, Câu hỏi, A, B, C, D (có cột "Đáp án" thì tự điền). Word: "Câu 1: …" rồi A. B. C. D., đáp án đúng tô <b>chữ đỏ</b>/highlight/in đậm/gạch chân, hoặc có dòng "Đáp án: B". PDF: chỉ đọc được chữ, không đọc được định dạng.</p><textarea id="pt" rows="5" placeholder="Hoặc dán văn bản (copy từ PDF/Word) vào đây…"></textarea><p><button data-a="pt">Phân tích văn bản dán</button></p></div>${PV?vPV():''}
<div class="card"><b>Backup dữ liệu</b><p class="m">Dữ liệu lưu trong trình duyệt của từng thiết bị. Tải backup để chuyển sang máy khác.</p><div class="row"><button data-a="exp">Tải backup (.json)</button><label class="btn">Nhập backup<input type="file" data-c="jf" accept=".json" hidden></label></div></div>`}
function vPV(){const q=PV.qs,na=q.filter(x=>!x.a.length).length,bad=q.filter(x=>x.o.length<2||x.o.length>8||!x.q),f=q[0];
 return `<div class="card"><b>Xem trước: ${esc(PV.name)}</b><p>Nhận diện <b>${q.length}</b> câu · ${q.length-na} có đáp án · ${na} chưa có đáp án · <b style="color:var(--${bad.length?'no':'ok'})">${bad.length} câu đáng ngờ</b></p>${bad.slice(0,8).map(x=>`<div class="opt"><span>⚠ ${esc(x.q.slice(0,90))||'(trống)'} — ${x.o.length} đáp án</span></div>`).join('')}
${f?`<p class="m">Câu đầu tiên:</p><div class="opt"><span>${esc(f.q.slice(0,150))}<br>${f.o.map((o,j)=>(f.a.includes(j)?'✓ ':'')+LET[j]+'. '+esc(o.slice(0,50))).join(' | ')}</span></div>`:''}
<div class="row"><button class="p" data-a="imp">Thêm vào bộ hiện tại</button><button data-a="impn">Tạo bộ mới</button><button data-a="pvx">Hủy</button></div></div>`}
async function onFile(f){if(!f)return;toast('Đang đọc file…');
 try{const n=f.name.toLowerCase();let qs;const need=(o,t)=>{if(!o)throw Error('chưa tải được thư viện '+t+' (cần mạng)')};
  if(/\.(xlsx|xls|csv)$/.test(n)){need(window.XLSX,'Excel');const wb=n.endsWith('.csv')?XLSX.read(await f.text(),{type:'string'}):XLSX.read(await f.arrayBuffer(),{type:'array'});qs=fromRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''}))}
  else if(n.endsWith('.docx')){need(window.JSZip,'Word');qs=fromLines(await docxLines(f))}
  else if(n.endsWith('.pdf')){need(window.pdfjsLib,'PDF');qs=fromLines(await pdfLines(f))}
  else qs=fromLines((await f.text()).split(/\r?\n/).map(t=>({t:t.trim(),f:{}})).filter(x=>x.t));
  PV={name:f.name,qs};toast(qs.length?'Đã đọc xong':'Không nhận diện được câu nào. Thử dán văn bản vào ô bên dưới.');R()}
 catch(e){toast('Lỗi: '+e.message+'. Thử dán văn bản vào ô bên dưới.')}}

// ===== XỬ LÝ SỰ KIỆN =====
const A={tab:d=>{V=d.k;R()},
 nd(){const n=prompt('Tên bộ đề mới:');if(n&&n.trim()){const d={id:uid(),name:n.trim(),qs:[]};S.decks.push(d);S.cur=d.id;save();R()}},
 rd(){const n=prompt('Đổi tên bộ đề:',D().name);if(n&&n.trim()){D().name=n.trim();save();R()}},
 dd(){if(S.decks.length<2)return toast('Phải còn ít nhất 1 bộ đề');if(confirm(`Xóa bộ "${D().name}" cùng ${D().qs.length} câu hỏi?`)){S.decks=S.decks.filter(x=>x!==D());S.cur=S.decks[0].id;P=null;save();R()}},
 add(){E={i:-1,q:mk('',['','','',''])};M()},
 edit:d=>{E={i:+d.i,q:JSON.parse(JSON.stringify(D().qs[+d.i]))};M()},
 ao(){sy();E.q.o.push('');M()},
 rmo:d=>{sy();if(E.q.o.length<=2)return toast('Cần ít nhất 2 đáp án');const j=+d.j;E.q.o.splice(j,1);E.q.a=E.q.a.filter(x=>x!==j).map(x=>x>j?x-1:x);M()},
 es(){sy();const q=E.q;if(!q.q.trim())return toast('Chưa nhập câu hỏi');const keep=q.o.map((o,j)=>o.trim()?j:-1).filter(j=>j>=0);
  q.a=q.a.filter(j=>keep.includes(j)).map(j=>keep.indexOf(j));q.o=keep.map(j=>q.o[j].trim());q.q=q.q.trim();if(q.o.length<2)return toast('Cần ít nhất 2 đáp án');
  const d=D();E.i>=0?d.qs[E.i]=q:d.qs.push(q);E=null;save();R()},
 ec(){E=null;M()},
 edel(){if(confirm('Xóa câu hỏi này?')){D().qs.splice(E.i,1);E=null;save();R()}},
 qk:d=>{const q=D().qs.find(x=>x.id===d.id);q.a=[+d.j];UD.push(q.id);save();R()},
 qs:d=>{SK.add(d.id);R()},qu(){const q=D().qs.find(x=>x.id===UD.pop());if(q){q.a=[];SK.delete(q.id);save()}R()},rs(){SK.clear();R()},
 ps:d=>{PS[d.k]=d.v;R()},
 st(){const d=D();const pool=d.qs.filter(q=>q.a.length&&q.o.length>1&&(PS.pool!=='wr'||q.w>0));if(!pool.length)return toast('Không có câu nào phù hợp (câu cần có đáp án).');
  S.ps=PS;save();const n=PS.n==='all'?pool.length:Math.max(1,Math.min(+PS.n||pool.length,pool.length)),pick=shuf(pool.slice()).slice(0,n);if(!PS.sq)pick.sort((a,b)=>d.qs.indexOf(a)-d.qs.indexOf(b));
  P={mode:PS.mode,items:pick.map(mkI),i:0,ok:0,opt:true};R()},
 pk:d=>{const it=P.items[P.i],oi=+d.oi;if(it.done)return;it.sel=it.q.a.length>1?(it.sel.includes(oi)?it.sel.filter(x=>x!==oi):[...it.sel,oi]):[oi];if(P.mode==='learn'&&it.q.a.length===1)it.done=true;R()},
 chk(){P.items[P.i].done=true;R()},nx(){if(P.i<P.items.length-1){P.i++;R()}},pv(){if(P.i>0){P.i--;R()}},
 sub(){const u=P.items.filter(x=>!x.sel.length).length;if(u&&!confirm(`Còn ${u} câu chưa trả lời. Nộp bài?`))return;fin()},
 flt:d=>{P.flt=d.k;R()},ex(){P=null;R()},
 retry(){const w=P.items.filter(x=>!x.ok).map(x=>mkI(x.q));P={mode:P.mode,items:w,i:0,ok:0,opt:true};R()},
 fl(){P.flip=true;R()},kn(){const c=P.items.shift();if(c.q.w>0)c.q.w--;P.ok++;P.flip=false;save();R()},no(){const c=P.items.shift();c.q.w=(c.q.w||0)+1;P.items.push(c);P.flip=false;save();R()},
 pt(){const qs=fromLines($('#pt').value.split(/\r?\n/).map(t=>({t:t.trim(),f:{}})).filter(x=>x.t));PV={name:'Văn bản dán',qs};toast(qs.length?'Đã phân tích':'Không nhận diện được câu nào');R()},
 imp(){D().qs.push(...PV.qs);PV=null;save();V='edit';R();toast('Đã thêm câu hỏi')},
 impn(){const d={id:uid(),name:PV.name.replace(/\.\w+$/,''),qs:PV.qs};S.decks.push(d);S.cur=d.id;PV=null;save();V='edit';R()},
 pvx(){PV=null;R()},
 exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='quiz-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}};
const C={deck:t=>{S.cur=t.value;save();P=null;R()},sf:t=>{F.f=t.value;L()},file:t=>{onFile(t.files[0]);t.value=''},
 psq:t=>{PS.sq=t.checked},pso:t=>{PS.so=t.value},psn:t=>{if(t.value){PS.n=t.value;R()}},popt:t=>{P.opt=t.checked;R()},
 jf:async t=>{try{const j=JSON.parse(await t.files[0].text());if(!j.decks||!j.decks.length)throw 0;
  if(confirm('OK = THAY toàn bộ dữ liệu hiện tại bằng file backup.\nHủy = GỘP thêm các bộ đề trong file vào dữ liệu hiện tại.'))S=j;else j.decks.forEach(d=>{d.id=uid();S.decks.push(d)});
  S.cur=S.decks[0].id;P=null;save();R();toast('Đã nhập backup')}catch(e){toast('File backup không hợp lệ')}t.value=''}};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&A[a.dataset.a])A[a.dataset.a](a.dataset)});
document.addEventListener('input',e=>{if(e.target.id==='sq'){F.q=e.target.value;L()}});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(c&&C[c])C[c](e.target)});
document.addEventListener('keydown',e=>{if(E||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey)return;const j=LET.indexOf(e.key.toUpperCase());
 if(V==='quick'&&j>=0&&e.key.length===1){const b=document.querySelector(`[data-a="qk"][data-j="${j}"]`);b&&b.click()}
 else if(V==='prac'&&P&&!P.end&&P.mode!=='card'){if(j>=0&&e.key.length===1){const b=document.querySelectorAll('[data-a="pk"]')[j];b&&b.click()}else if(e.key==='ArrowRight')A.nx();else if(e.key==='ArrowLeft')A.pv()}});
R();
</script></body></html>
